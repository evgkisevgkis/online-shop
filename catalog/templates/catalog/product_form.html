{% extends 'catalog/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<form method="post" class="row" enctype="multipart/form-data">
    <div class="col-6">
        {% csrf_token %}
        <div class="card">
            <div class="card-header">
                Продукт
            </div>
            <div class="card-body">
            {{ form|crispy }}
            </div>
            <button class="btn btn-primary" type="submit">
                {% if object %}
                Сохранить изменения
                {% else %}
                Создать
                {% endif %}
            </button>
        </div>
    </div>
    {% if object %}
    <div class="col-6">
        <div class="card">
            <div class="card-header">
                Версия
            </div>
            <div class="card-body">
            {{ formset.management_form }}
            {% for form in formset.forms %}
            {{ form|crispy }}
            <hr>
            {% endfor %}
            </div>
        </div>
    </div>
    {% endif %}
</form>


{% endblock %}
